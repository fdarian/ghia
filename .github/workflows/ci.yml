name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - LICENSE
      - NOTICE
      - '.changeset/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - LICENSE
      - NOTICE
      - '.changeset/**'
  # Runs the React tests, which push and pull_request leave out (see react-tests).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Version Packages PRs only change versions and changelogs.
    if: github.head_ref != 'changeset-release/main'
    runs-on: macos-latest
    timeout-minutes: 180
    outputs:
      build-react: ${{ steps.build-react.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with: { cache: true }

      # Reads the channel from rust-toolchain.toml, which must match zed's pin
      # for the gpui revision in packages/native/Cargo.toml. The action's own
      # cache is off: the rust-cache step below keys it for packages/native.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin
          cache: false
          # The action defaults to RUSTFLAGS="-D warnings"; lint policy lives in the crate.
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native

      # gpui_apple compiles shaders with `metal`, which Xcode 26 no longer ships
      # by default; without this the build fails with "missing Metal Toolchain".
      - run: xcodebuild -downloadComponent MetalToolchain

      - run: bun run build
        working-directory: packages/native
      - run: bun run build
        working-directory: packages/vite
      - run: bun run build
        working-directory: packages/solid
      - id: build-react
        run: bun run build
        working-directory: packages/react

      # react-tests runs on other runners and needs what the builds generated.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            packages/native/index.js
            packages/native/index.cjs
            packages/native/index.d.ts
            packages/native/gpuix-native.darwin-arm64.node
            packages/native/dist
            packages/solid/dist
            packages/react/dist
          retention-days: 1
          if-no-files-found: error

      # A failing suite must not hide the ones after it, but a failed build stops the job:
      # a step after a failure is skipped, so react's build succeeding means all four did.
      - if: ${{ !cancelled() && steps.build-react.outcome == 'success' }}
        run: bun run test
        working-directory: packages/native
      - if: ${{ !cancelled() && steps.build-react.outcome == 'success' }}
        run: bun run test
        working-directory: packages/vite
      - if: ${{ !cancelled() && steps.build-react.outcome == 'success' }}
        run: bun run test
        working-directory: packages/solid
      - if: ${{ !cancelled() && steps.build-react.outcome == 'success' }}
        run: bun run test
        working-directory: examples

  # The React suite is too slow for every push, so it runs on demand only.
  # A runner has 3 vCPUs and fits two test files at a time; three shards split the suite across runners.
  # It runs even when a check suite failed, as long as the builds it needs succeeded.
  react-tests:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.check.outputs.build-react == 'success' }}
    needs: check
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # fonts-option.test.tsx reads a font from zed/assets.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with: { cache: true }
      # The artifact's common root is packages/.
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: packages
      - run: bun run test -- --shard=${{ matrix.shard }}/3
        working-directory: packages/react
        timeout-minutes: 30
