name: CI

on:
  # No paths-ignore: a required check has to report on every PR, docs-only ones included.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Ordinary PRs are checked locally (docs/fork/testing.md) and get a skipped, green ci-passed.
    # The Version Packages PR is opened by github-actions[bot], so its pull_request run waits for
    # "Approve and run", which is one of the two manual ways to start it (the other is a /ci comment).
    if: github.event_name != 'pull_request' || github.head_ref == 'changeset-release/main'
    runs-on: macos-latest
    timeout-minutes: 180
    outputs:
      build-react: ${{ steps.build-react.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with: { cache: true }

      # Reads the channel from rust-toolchain.toml, which must match zed's pin
      # for the gpui revision in packages/native/Cargo.toml. The action's own
      # cache is off: the rust-cache step below keys it for packages/native.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin
          cache: false
          # The action defaults to RUSTFLAGS="-D warnings"; lint policy lives in the crate.
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native

      # gpui_apple compiles shaders with `metal`, which Xcode 26 no longer ships
      # by default; without this the build fails with "missing Metal Toolchain".
      - run: xcodebuild -downloadComponent MetalToolchain

      - run: bun run build
        working-directory: packages/native
      - run: bun run build
        working-directory: packages/ghia
      - run: bun run build
        working-directory: packages/solid
      - id: build-react
        run: bun run build
        working-directory: packages/react

      # react-tests runs on other runners and needs what the builds generated.
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            packages/native/index.js
            packages/native/index.cjs
            packages/native/index.d.ts
            packages/native/gpuix-native.darwin-arm64.node
            packages/native/dist
            packages/solid/dist
            packages/react/dist
          retention-days: 1
          if-no-files-found: error

      # A failing suite must not hide the ones after it, but a failed build stops the job:
      # a step after a failure is skipped, so react's build succeeding means all four did.
      - if: ${{ !cancelled() && steps.build-react.outcome == 'success' }}
        run: bun run test
        working-directory: packages/native
      - if: ${{ !cancelled() && steps.build-react.outcome == 'success' }}
        run: bun run test
        working-directory: packages/ghia
      - if: ${{ !cancelled() && steps.build-react.outcome == 'success' }}
        run: bun run test
        working-directory: packages/solid
      - if: ${{ !cancelled() && steps.build-react.outcome == 'success' }}
        run: bun run test
        working-directory: examples

  # The React suite is the slowest part, so it gets its own runners.
  # A runner has 3 vCPUs and fits two test files at a time; three shards split the suite across runners.
  # It runs even when a check suite failed, as long as the builds it needs succeeded.
  react-tests:
    if: ${{ !cancelled() && needs.check.outputs.build-react == 'success' }}
    needs: check
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # fonts-option.test.tsx reads a font from zed/assets.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with: { cache: true }
      # The artifact's common root is packages/.
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: packages
      - run: bun run test -- --shard=${{ matrix.shard }}/3
        working-directory: packages/react
        timeout-minutes: 30

  # The one status the ruleset on main requires. Skipped needs pass, so ordinary PRs are not blocked.
  ci-passed:
    if: always()
    needs: [check, react-tests]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
