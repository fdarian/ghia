name: Release

on:
  push:
    branches: [main]
    paths: ['.changeset/**']

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # ci:release builds the macOS addon, so the publish runs on this machine.
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No cache: a release job must not restore a cache an untrusted run wrote.
      - uses: ./.github/actions/setup
        with: { registry-url: 'https://registry.npmjs.org' }

      # changesets/action only publishes (and so builds) when no changeset is pending;
      # otherwise it just updates the version PR, which needs neither zed nor Rust.
      - id: mode
        run: |
          if [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md -print -quit)" ]; then
            echo publish=false >> "$GITHUB_OUTPUT"
          else
            echo publish=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.mode.outputs.publish == 'true'
        run: git submodule update --init --recursive

      - if: steps.mode.outputs.publish == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin
          cache: false
          rustflags: ''
      - if: steps.mode.outputs.publish == 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run ci:version
          publish-script: bun run ci:release
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
