# Temporary diagnostic for the wheel-translate partial redraw failing on the macOS 26 runner. Revert before any PR.
name: Diag scroll

on:
  push:
    branches: [claude/project-thread-1vhrog]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with: { cache: true }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin
          cache: false
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native
      - run: xcodebuild -downloadComponent MetalToolchain

      - run: bun run build
        working-directory: packages/native
      - run: bun run build
        working-directory: packages/ghia
      - run: bun run build
        working-directory: packages/solid

      - continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/dump"
          { sw_vers; system_profiler SPDisplaysDataType; } 2>&1 | tee "$RUNNER_TEMP/dump/machine.txt"

# GPUI_GPU_TIMES names a file the Metal renderer appends one line per presented frame to (damage, shift, rects).
      - name: Whole suite 1
        continue-on-error: true
        working-directory: packages/solid
        env:
          PARTIAL_REDRAW_DUMP: ${{ runner.temp }}/dump/suite-1
          GPUI_GPU_TIMES: ${{ runner.temp }}/dump/suite-1/gpu-times.txt
        run: |
          mkdir -p "$PARTIAL_REDRAW_DUMP"
          bun --bun vitest run 2>&1 | tee "$PARTIAL_REDRAW_DUMP/log.txt"
      - name: Whole suite 2
        continue-on-error: true
        working-directory: packages/solid
        env:
          PARTIAL_REDRAW_DUMP: ${{ runner.temp }}/dump/suite-2
          GPUI_GPU_TIMES: ${{ runner.temp }}/dump/suite-2/gpu-times.txt
        run: |
          mkdir -p "$PARTIAL_REDRAW_DUMP"
          bun --bun vitest run 2>&1 | tee "$PARTIAL_REDRAW_DUMP/log.txt"
      - name: File only 1
        continue-on-error: true
        working-directory: packages/solid
        env:
          PARTIAL_REDRAW_DUMP: ${{ runner.temp }}/dump/file-1
          GPUI_GPU_TIMES: ${{ runner.temp }}/dump/file-1/gpu-times.txt
        run: |
          mkdir -p "$PARTIAL_REDRAW_DUMP"
          bun --bun vitest run src/__tests__/partial-redraw.test.tsx 2>&1 | tee "$PARTIAL_REDRAW_DUMP/log.txt"
      - name: File only 2
        continue-on-error: true
        working-directory: packages/solid
        env:
          PARTIAL_REDRAW_DUMP: ${{ runner.temp }}/dump/file-2
          GPUI_GPU_TIMES: ${{ runner.temp }}/dump/file-2/gpu-times.txt
        run: |
          mkdir -p "$PARTIAL_REDRAW_DUMP"
          bun --bun vitest run src/__tests__/partial-redraw.test.tsx 2>&1 | tee "$PARTIAL_REDRAW_DUMP/log.txt"
      - name: File only 3
        continue-on-error: true
        working-directory: packages/solid
        env:
          PARTIAL_REDRAW_DUMP: ${{ runner.temp }}/dump/file-3
          GPUI_GPU_TIMES: ${{ runner.temp }}/dump/file-3/gpu-times.txt
        run: |
          mkdir -p "$PARTIAL_REDRAW_DUMP"
          bun --bun vitest run src/__tests__/partial-redraw.test.tsx 2>&1 | tee "$PARTIAL_REDRAW_DUMP/log.txt"
      - name: File only under load
        continue-on-error: true
        working-directory: packages/solid
        env:
          PARTIAL_REDRAW_DUMP: ${{ runner.temp }}/dump/file-load
          GPUI_GPU_TIMES: ${{ runner.temp }}/dump/file-load/gpu-times.txt
        run: |
          mkdir -p "$PARTIAL_REDRAW_DUMP"
          pids=""
          for i in 1 2 3; do
            yes > /dev/null &
            pids="$pids $!"
          done
          status=0
          bun --bun vitest run src/__tests__/partial-redraw.test.tsx 2>&1 | tee "$PARTIAL_REDRAW_DUMP/log.txt" || status=$?
          kill $pids
          exit $status

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dump-${{ matrix.os }}
          path: ${{ runner.temp }}/dump
          if-no-files-found: warn
