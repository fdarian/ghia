# Temporary diagnostic for the wheel-translate partial redraw failing on the macOS 26 runner. Revert before any PR.
name: Diag scroll

on:
  push:
    branches: [claude/project-thread-1vhrog]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diag:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with: { cache: true }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin
          cache: false
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native
      - run: xcodebuild -downloadComponent MetalToolchain

      - run: bun run build
        working-directory: packages/native
      - run: bun run build
        working-directory: packages/ghia
      - run: bun run build
        working-directory: packages/solid

      - continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/dump"
          { sw_vers; system_profiler SPDisplaysDataType; } 2>&1 | tee "$RUNNER_TEMP/dump/machine.txt"

      # GPUI_GPU_TIMES names a file the Metal renderer appends one line per presented frame to (damage, shift, rects).
      # An iteration that passes deletes its dump dir, so only failures are uploaded.
      - name: Wheel test x60
        continue-on-error: true
        working-directory: packages/solid
        shell: bash
        run: |
          failed=0
          for i in $(seq 1 60); do
            dir="$RUNNER_TEMP/dump/wheel-$i"
            mkdir -p "$dir"
            PARTIAL_REDRAW_DUMP="$dir" GPUI_GPU_TIMES="$dir/gpu-times.txt" \
              bun --bun vitest run src/__tests__/partial-redraw.test.tsx -t "copies the pixels" 2>&1 | tee "$dir/log.txt"
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then
              rm -rf "$dir"
            else
              failed=$((failed + 1))
            fi
          done
          echo "failed iterations: $failed"
      - name: Whole file x6
        continue-on-error: true
        working-directory: packages/solid
        shell: bash
        run: |
          failed=0
          for i in $(seq 1 6); do
            dir="$RUNNER_TEMP/dump/file-$i"
            mkdir -p "$dir"
            PARTIAL_REDRAW_DUMP="$dir" GPUI_GPU_TIMES="$dir/gpu-times.txt" \
              bun --bun vitest run src/__tests__/partial-redraw.test.tsx 2>&1 | tee "$dir/log.txt"
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then
              rm -rf "$dir"
            else
              failed=$((failed + 1))
            fi
          done
          echo "failed iterations: $failed"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dump-${{ matrix.os }}
          path: ${{ runner.temp }}/dump
          if-no-files-found: warn
