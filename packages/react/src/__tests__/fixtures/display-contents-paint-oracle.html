<!doctype html>
<!--
  Oracle for display-contents.test.tsx: whether `opacity` and `visibility` on a `display: contents` wrapper reach its
  children. Four cells of 100px, each with a red 40px square at its top left, at (0,0), (100,0), (200,0) and (300,0).
  `display-contents-paint-oracle.sh` reads the colour at the middle of each square off a screenshot at device scale 1.
-->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;background:#fff}
.cell{position:absolute;top:0;width:100px;height:100px}
.child{width:40px;height:40px;background:#f00}
</style></head><body>
<div class="cell" style="left:0"><div style="display:contents;opacity:0"><div class="child"></div></div></div>
<div class="cell" style="left:100px"><div style="display:contents;visibility:hidden"><div class="child"></div></div></div>
<div class="cell" style="left:200px"><div style="display:contents;visibility:hidden"><div class="child" style="visibility:visible"></div></div></div>
<div class="cell" style="left:300px"><div style="opacity:0"><div class="child"></div></div></div>
</body></html>
